[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renombrem"
description = 'Rearrange music based on file metadata.'
readme = "README.md"
requires-python = ">=3.7"
license = " GPL-3.0+"
keywords = []
authors = [
  { name = "Wyatt Childers", email = "wchilders@nearce.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = ["pytaglib"]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/DarkArc/renombrem#readme"
Issues = "https://github.com/DarkArc/renombrem/issues"
Source = "https://github.com/DarkArc/renombrem"

[project.scripts]
renombrem = "renombrem.main:main"

[tool.hatch.version]
path = "renombrem/__about__.py"

[tool.hatch.build.targets.sdist]
[tool.hatch.build.targets.wheel]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
  "renombrem/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
